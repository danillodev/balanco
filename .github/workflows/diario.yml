name: Edição diária

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC = 06:00 em Brasília
  workflow_dispatch:       # permite rodar manualmente pelo botão

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python generate.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Salvar a edição
        run: |
          git config user.name "balanco-bot"
          git config user.email "balanco-bot@users.noreply.github.com"
          git add docs
          git commit -m "Edição $(date +%F)" || exit 0
          git push
